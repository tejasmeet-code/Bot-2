services:
  - type: web
    name: zenith-bot
    env: node
    plan: free
    region: ohio
    buildCommand: npm install -g pnpm && pnpm install --no-frozen-lockfile && pnpm --filter @workspace/api-server run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: START_DISCORD_BOT
        value: "true"
      - key: PORT
        value: 10000
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_WEBHOOK_URL_1
        sync: false
      - key: DISCORD_WEBHOOK_URL_3
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: MESSAGE_LOGS
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
