version: "3.8"

services:
  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4.0.8
    container_name: zenith-lavalink
    restart: unless-stopped
    environment:
      - _JAVA_OPTIONS=-Xmx1024M
    ports:
      - "2333:2333"
    volumes:
      - ./application.yml:/opt/Lavalink/application.yml:ro

  zenith-bot:
    build: .
    container_name: zenith-bot
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - LAVALINK_HOST=lavalink
      - LAVALINK_PORT=2333
      - LAVALINK_PASSWORD=youshallnotpass
      - LAVALINK_SECURE=false
    depends_on:
      - lavalink
    volumes:
      - zenith-bot-data:/app/.data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  zenith-bot-data:
    driver: local
